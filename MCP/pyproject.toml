[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-production-mcp"
version = "0.1.0"
description = "Novel Production MCP component"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
