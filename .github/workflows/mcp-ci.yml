name: MCP CI

on:
  pull_request:
  push:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CORE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - name: Verify installed CORE wheel
        run: uv run pytest -W error tests/test_installed_wheel.py -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -W error
      - run: uv run pytest -W error --cov=src/novel_core --cov-report=term-missing

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -W error
      - run: uv run pytest -W error --cov=src/novel_api --cov-report=term-missing

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MCP
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -W error
      - run: uv run pytest -W error --cov=src/novel_mcp --cov-report=term-missing
      - run: uv run pre-commit run --all-files
      - name: Verify source size from repository root
        working-directory: .
        run: python MCP/scripts/check_source_size.py
      - name: Verify repository boundaries
        run: uv run python scripts/check_repository_boundaries.py
      - name: Verify MCP tool inventory
        run: >-
          uv run python -c
          "from novel_mcp.mcp_server import ALL_TOOL_NAMES;
          assert len(ALL_TOOL_NAMES) == 59, len(ALL_TOOL_NAMES)"

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Phase A repository invariants
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin main --depth=1

          actual_migrations="$(find CORE/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)"
          expected_migrations="$(printf '%s\n' \
            001_initial.sql \
            002_search.sql \
            003_narrative.sql \
            004_drafts.sql)"
          test "${actual_migrations}" = "${expected_migrations}"
          test ! -d MCP/migrations
          test "$(git rev-parse HEAD:CORE/migrations/001_initial.sql)" = \
            "94ef881c163e6661622fcf842faee34230f9fb9b"
          test "$(git rev-parse HEAD:CORE/migrations/002_search.sql)" = \
            "db22e0d501f5279834ba486ee5913884a2da7701"
          test "$(git rev-parse HEAD:CORE/migrations/003_narrative.sql)" = \
            "5ac6cd8b1ec370bf228a5e4056f93f20bfd22ecb"
          test "$(git rev-parse HEAD:CORE/migrations/004_drafts.sql)" = \
            "1817edf2d51e5c91eae61205890a83f2347e88d7"
          test ! -f data/story.db
          test -z "$(git status --porcelain)"

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WEBUI/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: WEBUI/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  webui-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WEBUI/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: WEBUI/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sync API environment
        working-directory: API
        run: uv sync --all-groups
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
